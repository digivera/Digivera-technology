<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />

  <!-- Primary SEO -->
  <title>Digivera Technologies | Web Development, Software &amp; IT Consulting</title>
  <meta name="description"
    content="Empowering businesses with cutting-edge web development, software solutions, and IT consulting from Digivera Technologies." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://www.digivera.co.in/" />

  <!-- Search Console verification -->
  <meta name="google-site-verification" content="Sbt5_uMmTWYn2wI2ARaatoyJ0zNd6oP_wDMd8-ncB4Y" />

  <!-- Open Graph / Twitter -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Digivera Technologies" />
  <meta property="og:title" content="Digivera Technologies | Web Development, Software &amp; IT Consulting" />
  <meta property="og:description"
    content="Cutting-edge web development, software solutions, and IT consulting for growing businesses." />
  <meta property="og:url" content="https://www.digivera.co.in/" />
  <meta property="og:image" content="https://www.digivera.co.in/assets/img/og-image.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" sizes="any" />

  <!-- Structured data -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Digivera Technologies",
      "url": "https://www.digivera.co.in",
      "logo": "https://www.digivera.co.in/assets/img/logo.webp"
    }
  </script>

  <!-- Faster connection to third-party hosts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />

  <!-- Fonts: only the weights actually used -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" />

  <!-- Vendor CSS (one version of each library, pinned) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11.1.14/swiper-bundle.min.css"
    crossorigin="anonymous" />

  <!-- Site CSS: loaded AFTER vendor CSS so your overrides win -->
  <link rel="stylesheet" href="/assets/css/style.min.css" />
</head>

<body>
  <main>
    <noscript>You need to enable JavaScript to view this website.</noscript>
    <div id="root"></div>

    <!-- Vendor JS: deferred, executed in order (jQuery first, plugins after) -->
    <script defer src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/swiper@11.1.14/swiper-bundle.min.js" crossorigin="anonymous"></script>

    <!-- App entry -->
    <script type = "module" src="/src/main.tsx"></script>
  </main>
</body>

</html>
